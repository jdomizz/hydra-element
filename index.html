        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;

      hydra-element {
        width: 100%;
        height: 100%;
        display: block;
        overflow: hidden;
        background-color: #000;
        border-radius: 1rem;

      const sketchSelect = document.querySelector('#sketch')
      const elementSelect = document.querySelector('#element')
      const elements = document.querySelectorAll('hydra-element')

      function decodeHydraUrl(url) {
        const b64 = new URL(url).searchParams.get('code').replace(/-/g, '+').replace(/_/g, '/')
        return decodeURIComponent(atob(b64))
      }

      sketches.forEach((sketch, index) => {
        const option = document.createElement('option')
        option.value = index
        option.textContent = sketch.name
        sketchSelect.append(option)
      })

      elements.forEach((_, index) => {
        const option = document.createElement('option')
        option.value = index
        option.textContent = `element ${index + 1}`
        elementSelect.append(option)
      })

      document.querySelector('#eval').addEventListener('click', () => {
        const sketch = sketches[sketchSelect.value]
        const el = elements[elementSelect.value]
        el.setAttribute('audio', String(sketch.audio))
        el.code = decodeHydraUrl(sketch.url)
      })
