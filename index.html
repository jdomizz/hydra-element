<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>&lt;hydra-element&gt; playground</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍬</text></svg>"
    />
    <link rel="stylesheet" href="./playground/style.css" />
    <script type="module" src="./index.js"></script>
    <script type="module" src="./playground/main.js"></script>
  </head>
  <body>
    <main class="app">
      <aside class="app__left">
        <preset-selector target="#hydra"></preset-selector>
        <editor-panel target="#hydra"></editor-panel>
      </aside>

      <section class="app__center">
        <hydra-element id="hydra"></hydra-element>
      </section>

      <aside class="app__right">
        <cfg-form target="#hydra"></cfg-form>
        <log-panel target="#hydra" limit="50">
          <stats-strip slot="stats" target="#hydra"></stats-strip>
        </log-panel>
      </aside>
    </main>
  </body>
</html>
